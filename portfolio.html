<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="3RD IUDEX Team Portfolio Hub" />
    <meta name="author" content="IUDEX Team" />
    <title>IUDEX Portfolio Hub</title>

    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="stylesheet" href="assets/css/index.css">
    <link rel="stylesheet" href="assets/css/responsifcss.css">
    <link rel="stylesheet" href="assets/css/portoview.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.2.6/gsap.min.js"></script>

    <style>
        .filter-container {
            text-align: center;
            margin: 25px 0 35px 0;
            z-index: 10;
            position: relative;
        }

        .filter-btn {
            background: transparent;
            border: 1.5px solid #c70039;
            color: #c70039;
            padding: 8px 22px;
            margin: 5px;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.4s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #c70039;
            border-color: #c70039;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(199, 0, 57, 0.6);
            transform: translateY(-2px);
        }

        .member-banner {
            display: none;
            background: rgba(25, 25, 25, 0.85);
            border: 1px solid #c70039;
            border-radius: 15px;
            padding: 20px;
            margin: 0 auto 30px auto;
            max-width: 800px;
            color: #fff;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(199, 0, 57, 0.2);
        }

        .member-banner img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #c70039;
            margin-bottom: 12px;
        }

        .member-banner h3 {
            margin: 0 0 5px 0;
            color: #fff;
            font-family: 'Raleway', sans-serif;
        }

        .member-banner p {
            color: #ccc;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .member-socials a {
            color: #fff;
            margin: 0 8px;
            font-size: 18px;
            transition: color 0.2s;
            text-decoration: none;
        }

        .member-socials a:hover {
            color: #c70039;
        }

        .admin-link {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 999;
            background: rgba(199, 0, 57, 0.9);
            color: #fff;
            padding: 10px 18px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(199, 0, 57, 0.4);
            transition: all 0.3s ease;
        }
        .admin-link:hover {
            background: #900028;
            color: #fff;
            text-decoration: none;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div id="all">
        <div class="cursor"></div>
        <div id="breaker"></div>
        <div id="breaker-two"></div>

        <div id="navigation-content">
            <div class="logo">
                <a href="home.html">
                    <img src="assets/logo_foto/Team Logo.png" alt="logo">
                </a>
            </div>
            <div class="navigation-close">
                <span class="close-first"></span>
                <span class="close-second"></span>
            </div>
            <div class="navigation-links">
                <a href="home.html" data-text="HOME">HOME</a>
                <a href="portfolio.html" data-text="PORTFOLIO">PORTFOLIO</a>
                <a href="admin/login.html" data-text="ADMIN CMS">ADMIN CMS</a>
            </div>
        </div>

        <div id="navigation-bar">
            <a href="home.html">
                <img src="assets/logo_foto/Team Logo.png" alt="logo">
            </a>
            <div class="menubar">
                <span class="first-span"></span>
                <span class="second-span"></span>
                <span class="third-span"></span>
            </div>
        </div>

        <div id="header">
            <div id="particles"></div>

            <div id="services">
                <div class="services-heading wow">
                    Team <span class="color">Portfolio Hub</span>
                </div>

                <div class="filter-container">
                    <button class="filter-btn active" data-filter="all" onclick="setMemberFilter('all')">All Projects</button>
                    <button class="filter-btn" data-filter="sidik" onclick="setMemberFilter('sidik')">Muhamad Sidik</button>
                    <button class="filter-btn" data-filter="aliya" onclick="setMemberFilter('aliya')">Aliya Dewi</button>
                    <button class="filter-btn" data-filter="bilqis" onclick="setMemberFilter('bilqis')">Bilqis Syiefa</button>
                </div>

                <div class="member-banner" id="memberBanner">
                    <img id="bannerAvatar" src="" alt="Member Avatar">
                    <h3 id="bannerName">Member Name</h3>
                    <p id="bannerRole">Member Role</p>
                    <div class="member-socials" id="bannerSocials"></div>
                </div>

                <div class="services-content-wrapper">
                    <div class="services-content" id="galleryContainer">
                        <p class="text-white">Loading portfolio items...</p>
                    </div>
                </div>

                <div id="skills">
                    <div class="skills-header"></div>
                    <p><br></p>
                </div>
            </div>

            <div class="footer">
                <div class="footer-text">
                    <img src="assets/images/copyright.png" alt="copyright-img" class="images" height="14px"> 2026 | IUDEX Team
                </div>
            </div>
        </div>
    </div>

    <a href="admin/login.html" class="admin-link">CMS Admin</a>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/supabaseClient.js"></script>
    <script src="assets/js/projects.js"></script>
    <script src="assets/js/analytics.js"></script>
    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/particles.js"></script>
    <script src="assets/js/particles.min.js"></script>
    <script src="assets/js/index.js"></script>

    <script>
    const MEMBERS_DATA = {
        'sidik': {
            name: 'Muhamad Sidik',
            role: 'Project Manager, UI/UX, Full-stack Developer & DBA',
            avatar: 'uploads/sidik/sidiiik.JPG',
            facebook: 'https://www.facebook.com/Im.myusi.z3/',
            instagram: 'https://instagram.com/imyusi_',
            linkedin: 'https://www.linkedin.com/in/muhamad-sidik-a6757b25b'
        },
        'aliya': {
            name: 'Aliya Dewi Lestari',
            role: 'UI Designer, QA & Content Writer',
            avatar: 'uploads/aliya/Profilealiyafoto.jpg',
            facebook: 'https://www.tiktok.com/@scaramochie_',
            instagram: 'https://www.instagram.com/aeliya____',
            linkedin: 'https://www.linkedin.com/in/aliyaad'
        },
        'bilqis': {
            name: 'RR Bilqis Syiefa Latiefa',
            role: 'Responsive Design, Navigation & Content Strategist',
            avatar: 'uploads/bilqis/Profile_Portobilqis.jpeg',
            facebook: 'https://www.facebook.com/bilqis.syifal',
            instagram: 'https://instagram.com/bilqis.syi',
            linkedin: 'https://www.linkedin.com/in/bilqis-syifa-l-524626296/'
        }
    };

    let currentFilter = 'all';

    async function setMemberFilter(filter) {
        currentFilter = filter.toLowerCase();

        document.querySelectorAll('.filter-btn').forEach(btn => {
            if (btn.getAttribute('data-filter') === currentFilter) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        const banner = document.getElementById('memberBanner');
        if (currentFilter !== 'all' && MEMBERS_DATA[currentFilter]) {
            const m = MEMBERS_DATA[currentFilter];
            document.getElementById('bannerAvatar').src = m.avatar;
            document.getElementById('bannerName').textContent = m.name;
            document.getElementById('bannerRole').textContent = m.role;
            document.getElementById('bannerSocials').innerHTML = `
                ${m.facebook ? `<a href="${m.facebook}" target="_blank">Facebook/TikTok</a>` : ''}
                ${m.instagram ? `<a href="${m.instagram}" target="_blank">Instagram</a>` : ''}
                ${m.linkedin ? `<a href="${m.linkedin}" target="_blank">LinkedIn</a>` : ''}
            `;
            banner.style.display = 'block';
        } else {
            banner.style.display = 'none';
        }

        await renderGalleryItems();
    }

    async function renderGalleryItems() {
        const container = document.getElementById('galleryContainer');
        container.innerHTML = '<p class="text-white">Loading projects...</p>';

        try {
            let projects = [];
            if (currentFilter === 'all') {
                projects = await Projects.getAll();
            } else {
                projects = await Projects.getByAdmin(currentFilter);
            }

            if (!projects || projects.length === 0) {
                container.innerHTML = '<p class="text-white">No projects found for this member.</p>';
                return;
            }

            let html = '';
            projects.forEach(p => {
                const imgPath = p.image ? p.image : 'assets/images/placeholder.jpg';
                const adminName = p.admin || 'IUDEX';
                html += `
                    <div class="service-one service wow" style="margin: 15px; display: inline-block; vertical-align: top; text-align: left;">
                        <a href="${imgPath}" target="_blank" onclick="if(window.Analytics) Analytics.trackProjectView(${p.id || 0});" style="text-decoration: none;">
                            <div class="services-img">
                                <img src="${imgPath}" alt="${escapeHtml(p.title)}" onerror="this.onerror=null; this.src='assets/images/placeholder.jpg';">
                            </div>
                            <div class="services-description" style="padding: 15px;">
                                <h2 style="font-size: 20px; color: whitesmoke; margin-bottom: 5px;">${escapeHtml(p.title)}</h2>
                                <p style="font-size: 12px; color: #c70039; font-weight: bold; margin-bottom: 8px;">By ${escapeHtml(adminName)} • ${escapeHtml(p.date || '')}</p>
                                <p style="font-size: 14px; color: #ccc; line-height: 1.4;">${escapeHtml(p.description)}</p>
                            </div>
                        </a>
                    </div>
                `;
            });

            container.innerHTML = html;
        } catch (err) {
            console.error('Error rendering projects:', err);
            container.innerHTML = '<p class="text-white">Failed to load projects.</p>';
        }
    }

    function escapeHtml(str) {
        return String(str || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const memberParam = urlParams.get('member');
        if (memberParam && MEMBERS_DATA[memberParam.toLowerCase()]) {
            setMemberFilter(memberParam.toLowerCase());
        } else {
            setMemberFilter('all');
        }

        particlesJS("particles", {
            "particles": {
                "number": { "value": 200, "density": { "enable": true, "value_area": 700 } },
                "color": { "value": "random" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.5, "random": true },
                "size": { "value": 3, "random": true },
                "line_linked": { "enable": false },
                "move": { "enable": true, "speed": 3 }
            },
            "interactivity": { "detect_on": "canvas", "events": { "onclick": { "enable": true, "mode": "push" }, "resize": true } },
            "retina_detect": true
        });
    });
    </script>
</body>
</html>
