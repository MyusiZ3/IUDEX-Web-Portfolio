<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Project (Auto WebP Optimizer)</title>
    <link href="../assets/css/sb-admin-2.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
        }

        .form-container {
            max-width: 600px;
            margin: 30px auto;
            background-color: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 10px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            background-color: #f8f9fa;
            color: #495057;
        }

        button {
            background-color: #4e73df;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2e59d9;
        }

        .btn-cancel {
            background-color: #858796;
            color: #fff;
            padding: 10px 20px;
            border-radius: 4px;
            text-decoration: none;
            display: inline-block;
        }

        .optimization-badge {
            background-color: #1cc88a;
            color: white;
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 15px;
            display: inline-block;
            margin-top: 6px;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h3 class="mb-4 text-gray-800" id="editHeading">Edit Project</h3>
        
        <form id="updateProjectForm">
            <input type="hidden" id="projectId">
            
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="5" required></textarea>
            </div>

            <div class="form-group">
                <label for="admin">Admin</label>
                <select id="admin" name="admin" required>
                    <option value="Sidik">Sidik</option>
                    <option value="Aliya">Aliya</option>
                    <option value="Bilqis">Bilqis</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div class="form-group">
                <label>Current Image</label><br>
                <img id="currentImagePreview" src="" alt="Current Image" style="max-width: 200px; height: auto; border-radius: 4px; display: none; margin-bottom: 10px;">
            </div>

            <div class="form-group">
                <label for="newImageFile">Upload New Image (Auto Convert WebP)</label>
                <input type="file" id="newImageFile" name="newImageFile" accept="image/*" onchange="handleFileSelect(this)">
                <div id="webpPreviewContainer" style="display: none; margin-top: 8px;">
                    <img id="newWebpPreview" src="" style="max-width: 200px; border-radius: 4px;">
                    <br>
                    <span class="optimization-badge" id="optStats">WebP Stats</span>
                </div>
                <input type="hidden" id="newImagePayload">
            </div>

            <button type="submit">Update Project</button>
            <a href="projects.html" class="btn-cancel">Cancel</a>
        </form>
    </div>

    <!-- Supabase SDK & Modules -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/supabaseClient.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/imageOptimizer.js"></script>
    <script src="../assets/js/projects.js"></script>

    <script>
        Auth.requireAuth();

        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');

        let convertedImageDataUrl = '';

        if (!projectId) {
            alert('Invalid request.');
            window.location.href = 'projects.html';
        }

        async function initEdit() {
            const project = await Projects.getById(projectId);
            if (!project) {
                alert('Project not found.');
                window.location.href = 'projects.html';
                return;
            }

            document.getElementById('editHeading').textContent = `Edit Project #${project.id}`;
            document.getElementById('projectId').value = project.id;
            document.getElementById('title').value = project.title || '';
            document.getElementById('description').value = project.description || '';
            document.getElementById('admin').value = project.admin || 'Sidik';
            document.getElementById('date').value = project.date || '';

            if (project.image) {
                const imgEl = document.getElementById('currentImagePreview');
                imgEl.src = project.image;
                imgEl.style.display = 'block';
            }
        }

        async function handleFileSelect(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                try {
                    const result = await ImageOptimizer.convertToWebP(file, { maxWidth: 1920, quality: 0.85 });
                    convertedImageDataUrl = result.dataUrl;

                    document.getElementById('newWebpPreview').src = result.dataUrl;
                    document.getElementById('optStats').textContent = `Asli: ${result.originalSizeFormatted} ➔ WebP: ${result.webpSizeFormatted} (${result.compressionRatio} hemat)`;
                    document.getElementById('webpPreviewContainer').style.display = 'block';
                    document.getElementById('newImagePayload').value = result.dataUrl;
                } catch (err) {
                    alert('Gagal mengompresi gambar: ' + err.message);
                }
            }
        }

        document.getElementById('updateProjectForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const id = document.getElementById('projectId').value;
            const title = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();
            const admin = document.getElementById('admin').value;
            const date = document.getElementById('date').value;
            const newImagePayload = document.getElementById('newImagePayload').value || convertedImageDataUrl;

            const res = await Projects.update(id, title, description, admin, date, newImagePayload || null);
            if (res.success) {
                alert('Successfully updated data with WebP optimization!');
                window.location.href = 'projects.html';
            } else {
                alert('Error updating record: ' + (res.message || 'Error'));
            }
        });

        document.addEventListener('DOMContentLoaded', initEdit);
    </script>
</body>

</html>
