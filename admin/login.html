<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Admin Login - IUDEX Portfolio</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <link href="../assets/css/sb-admin-2.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-body: #0c0d10;
            --bg-card: #14151a;
            --border: #22242b;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --accent: #ff4757;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            padding: 36px 32px;
        }

        .brand-title {
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .brand-subtitle {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            background: #0c0d10;
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--text-sub);
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            padding: 4px;
        }

        .toggle-btn:hover {
            color: var(--text-main);
        }

        .btn-submit {
            width: 100%;
            background: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 8px;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert-error {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.3);
            color: var(--accent);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }

        .footer-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s;
        }

        .footer-link:hover {
            color: var(--text-main);
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="brand-title">IUDEX Admin</div>
        <div class="brand-subtitle">Kelola portofolio tim IUDEX</div>

        <div class="alert-error" id="errorMessage">Username atau password tidak sesuai</div>

        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" class="form-input" placeholder="Masukkan username" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" class="form-input" placeholder="Masukkan password" required>
                    <button type="button" class="toggle-btn" id="togglePasswordBtn">Lihat</button>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Masuk</button>
        </form>

        <a href="../home.html" class="footer-link">Kembali ke Website</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/supabaseClient.js"></script>
    <script src="../assets/js/auth.js"></script>

    <script>
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('togglePasswordBtn');

        toggleBtn.addEventListener('click', function () {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            this.textContent = isPassword ? 'Sembunyi' : 'Lihat';
        });

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = passwordInput.value.trim();
            const errEl = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');

            errEl.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Memproses...';

            try {
                const result = await Auth.login(username, password);
                if (result.success) {
                    window.location.href = 'index.html';
                } else {
                    errEl.textContent = result.message || 'Username atau password tidak sesuai.';
                    errEl.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Masuk';
                }
            } catch (err) {
                errEl.textContent = 'Gagal terhubung ke server.';
                errEl.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Masuk';
            }
        });
    </script>
</body>

</html>
